<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>TranslateChat AI Settings</title>
  <style>
    :root { color-scheme: light; font: 14px system-ui, sans-serif; color:#17232b; background:#f2f5f6; }
    body { max-width:760px; margin:32px auto; padding:0 20px; }
    section { background:#fff; border:1px solid #d9e1e3; border-radius:12px; padding:18px; margin:14px 0; }
    h1 { margin:0 0 4px; } h2 { font-size:16px; margin:0 0 12px; }
    label { display:block; margin:10px 0 4px; color:#52626a; }
    input, select, button { box-sizing:border-box; width:100%; padding:8px; border:1px solid #c9d4d7; border-radius:7px; background:#fff; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .check { display:flex; gap:8px; align-items:center; margin:11px 0; } .check input { width:auto; }
    .actions { display:flex; gap:8px; } .actions button { width:auto; }
    .room-row { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #edf1f2; }
    .room-row:last-child { border-bottom:0; } .room-row span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .room-row button { width:auto; padding:5px 9px; }
    #save { background:#287d70; border-color:#287d70; color:#fff; } #status { min-height:20px; margin-top:12px; }
    .error { color:#9a3d34; font-size:12px; } .hint { color:#65747a; font-size:12px; }
    @media(max-width:620px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <h1>TranslateChat AI Settings</h1>
  <p class="hint">API key chỉ lưu local trong extension. Không dùng Chrome Sync.</p>
  <section>
    <h2>AI Provider</h2>
    <label for="baseUrl">Base URL</label><input id="baseUrl" placeholder="https://provider.example/v1">
    <label for="apiKey">API key</label><input id="apiKey" type="password" autocomplete="off">
    <div class="grid">
      <div><label for="model">Model</label><input id="model" list="models"><datalist id="models"></datalist></div>
      <div><label for="timeout">Timeout (ms)</label><input id="timeout" type="number" min="1000" max="120000"></div>
    </div>
    <div class="actions"><button id="load-models">Load models</button><button id="test-provider">Test connection</button></div>
    <div id="provider-status" class="hint" role="status"></div>
  </section>
  <section>
    <h2>Translation</h2>
    <div class="grid">
      <div><label for="target">Default target</label><select id="target"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div>
      <div><label for="source">Source</label><select id="source"><option value="auto">Auto detect</option><option value="ja">日本語</option><option value="en">English</option></select></div>
    </div>
    <label class="check"><input id="autoTranslate" type="checkbox"> Tự dịch message mới</label>
    <label class="check"><input id="showOriginal" type="checkbox"> Hiện original</label>
  </section>
  <section>
    <h2>Rooms được bật</h2>
    <div id="room-list" class="hint">Chưa bật room nào.</div>
  </section>
  <section>
    <h2>Summary</h2>
    <div class="grid">
      <div><label for="summaryLanguage">Summary language</label><select id="summaryLanguage"><option value="vi">Tiếng Việt</option><option value="en">English</option><option value="ja">日本語</option></select></div>
      <div><label for="summaryLength">Length</label><select id="summaryLength"><option value="short">Short</option><option value="medium">Medium</option><option value="long">Long</option></select></div>
    </div>
    <label class="check"><input id="autoSummary" type="checkbox"> Tự cập nhật summary khi có message mới</label>
  </section>
  <section>
    <h2>Privacy and cache</h2>
    <label class="check"><input id="maskCredentials" type="checkbox"> Mask password, token, API key trước khi gửi AI</label>
    <label for="cacheTtlDays">Cache TTL</label><select id="cacheTtlDays"><option value="1">1 ngày</option><option value="7">7 ngày</option><option value="30">30 ngày</option></select>
    <div class="actions"><button id="clearTranslation">Xóa cache dịch</button><button id="clearSummary">Xóa cache summary</button></div>
  </section>
  <div class="actions"><button id="save">Lưu Settings</button></div>
  <div id="status" role="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
